# 校外教学讲义下载列表 / Outreach lecture notes for download
#
# 使用方法：
#   1. 把讲义 PDF 放到  files/lectures/  目录（例如 files/lectures/mechanics-basics.pdf）
#   2. 在下面照着示例加一条记录（去掉 # 注释符）
#   3. 提交并推送即可，页面会自动出现该讲义 + 下载按钮
#
# 字段说明：
#   title    : 英文标题（英文页显示）
#   title_zh : 中文标题（中文页显示）
#   desc     : 英文简介（可选，一句话）
#   desc_zh  : 中文简介（可选）
#   level    : 层次，如 "High school" / "Competition"（英文页）
#   level_zh : 层次中文，如 "高中" / "物理竞赛"（中文页）
#   file     : PDF 相对路径，从 /files/lectures/ 开始，例如 /files/lectures/xxx.pdf
#   date     : 日期或年份（可选，用于排序，如 2023-09-01）

lectures:
  - title:    "Equations and Functions (Junior High Math Competition)"
    title_zh: "初中数学竞赛课：方程与函数"
    level:    "Junior high math competition"
    level_zh: "初中数学竞赛"
    file:     "/files/lectures/junior-math-equations-functions.pdf"
    date:     2024-01-01

  - title:    "Sequences and Inequalities (Math Competition: Advanced Algebra)"
    title_zh: "数学竞赛讲义：数列与不等式（代数拓展篇）"
    desc:     "Summation and product notation, sequences and inequalities for secondary-school math competitions."
    desc_zh:  "求和号与连乘号、数列、不等式，面向中学数学竞赛。"
    level:    "Math competition"
    level_zh: "中学数学竞赛"
    file:     "/files/lectures/math-competition-sequences-inequalities.pdf"
    date:     2026-08-04

  - title:    "Plane Vectors (Fundamentals + Advanced Extension)"
    title_zh: "平面向量：基础 + 培优拓展"
    desc:     "Concepts, operations, the fundamental theorem and coordinates, applications, and an introduction to vector spaces."
    desc_zh:  "向量的概念与运算、平面向量基本定理及坐标表示、向量的应用，并拓展至向量空间。"
    level:    "High school / Advanced"
    level_zh: "高中 / 培优"
    file:     "/files/lectures/plane-vectors.pdf"
    date:     2026-08-05

  - title:    "Trigonometric Functions (Junior High Math Competition)"
    title_zh: "初中数学竞赛课：三角函数"
    desc:     "Acute-angle trigonometric functions, with a high-school extension to general angles, radians and reduction formulas."
    desc_zh:  "锐角三角函数及基本关系，并拓展到高中的任意角、弧度制与诱导公式。"
    level:    "Junior high math competition"
    level_zh: "初中数学竞赛"
    file:     "/files/lectures/junior-math-trigonometry.pdf"
    date:     2026-07-14

