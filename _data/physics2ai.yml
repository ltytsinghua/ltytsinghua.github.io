# Data for the "From Physics to AI" column (/physics-to-ai/, /zh/physics-to-ai/).
#
# sections: each entry in _physics2ai/ sets `section:` to one of these keys.
#           The landing pages list entries grouped in this order.
#           Optional: desc / desc_zh (one-line description under the heading).
# roadmap:  learning roadmap shown on the landing pages (hidden while empty).
#           status: done | doing | todo
#           Example:
#             - stage: "Transformer and attention"
#               stage_zh: "Transformer 与注意力机制"
#               status: doing

sections:
  - key: journal
    name: "Journal"
    name_zh: "旅程日志"
    icon: "fas fa-route"
  - key: notes
    name: "Notes"
    name_zh: "知识笔记"
    icon: "fas fa-book"
  - key: papers
    name: "Paper Reading"
    name_zh: "论文精读"
    icon: "fas fa-file-alt"
  - key: minimal-model
    name: "Projects: Minimal Model"
    name_zh: "项目实践：Minimal Model"
    icon: "fas fa-tools"
    desc: "Reproducing machine learning and LLM projects with limited compute."
    desc_zh: "在资源和算力有限的条件下，复现机器学习和大模型项目的尝试。"
  - key: internship
    name: "Internship"
    name_zh: "实习记录"
    icon: "fas fa-briefcase"
  - key: physics-x-ai
    name: "Physics × AI"
    name_zh: "物理视角"
    icon: "fas fa-atom"

roadmap:
  - stage: "nano-deepseek: data and vocabulary"
    stage_zh: "nano-deepseek：数据与词表"
    status: done
  - stage: "nano-deepseek v0: LLaMA-style baseline (RMSNorm, RoPE, SwiGLU)"
    stage_zh: "nano-deepseek v0：LLaMA 风格基线（RMSNorm、RoPE、SwiGLU）"
    status: doing
  - stage: "nano-deepseek v1 ≈ DeepSeek-V2: MLA, DeepSeekMoE"
    stage_zh: "nano-deepseek v1 ≈ DeepSeek-V2：MLA、DeepSeekMoE"
    status: todo
  - stage: "nano-deepseek v2 ≈ DeepSeek-V3: auxiliary-loss-free load balancing, MTP"
    stage_zh: "nano-deepseek v2 ≈ DeepSeek-V3：无辅助损失负载均衡、MTP"
    status: todo
  - stage: "nano-deepseek v3 ≈ DeepSeek-R1: GRPO, R1-Zero / R1 training, distillation"
    stage_zh: "nano-deepseek v3 ≈ DeepSeek-R1：GRPO、R1-Zero / R1 多阶段训练、蒸馏"
    status: todo
  - stage: "nano-deepseek v4 ≈ DeepSeek-V4: mHC, Muon, on-policy distillation"
    stage_zh: "nano-deepseek v4 ≈ DeepSeek-V4：mHC、Muon、On-Policy Distillation"
    status: todo
